[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
description = "A fast, agent-native SPICE circuit simulator in Rust"
repository = "https://github.com/hayatree/sansho"
keywords = ["spice", "circuit", "simulation", "verilog-a", "mcp"]
categories = ["science", "simulation", "command-line-utilities"]
readme = "README.md"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Diagnostics are rich (culprits, attempts, suggestions) and only travel on error paths,
# where their size does not matter.
result_large_err = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
