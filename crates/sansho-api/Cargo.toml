[package]
name = "sansho-api"
description = "Session / job API with structured, reproducible results"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
sansho-diag = { path = "../sansho-diag" }
sansho-engine = { path = "../sansho-engine" }
sansho-netlist = { path = "../sansho-netlist" }
sansho-output = { path = "../sansho-output" }

[features]
jit = ["sansho-engine/jit"]
