[package]
name = "sansho-verify"
description = "Compare simulation results against a reference simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
sansho-api = { path = "../sansho-api" }
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sansho-engine = { path = "../sansho-engine" }
sansho-netlist = { path = "../sansho-netlist" }
sansho-output = { path = "../sansho-output" }

[features]
jit = ["sansho-engine/jit"]
