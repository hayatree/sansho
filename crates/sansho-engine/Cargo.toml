[package]
name = "sansho-engine"
description = "MNA assembly, nonlinear solver and circuit analyses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
sansho-diag = { path = "../sansho-diag" }
sansho-netlist = { path = "../sansho-netlist" }
sansho-devices = { path = "../sansho-devices" }
sansho-sparse = { path = "../sansho-sparse" }
sansho-output = { path = "../sansho-output" }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
sansho-va = { path = "../sansho-va" }
sansho-gpu = { path = "../sansho-gpu", optional = true }

[features]
jit = ["sansho-devices/jit"]
# Batched GPU device evaluation for Monte Carlo (CUDA, loaded at run time).
gpu = ["dep:sansho-gpu"]
