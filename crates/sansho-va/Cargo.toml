[package]
name = "sansho-va"
description = "Verilog-A compact-model compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
sansho-diag = { path = "../sansho-diag" }
cranelift-codegen = { version = "0.137.2", optional = true }
cranelift-frontend = { version = "0.137.2", optional = true }
cranelift-jit = { version = "0.137.2", optional = true }
cranelift-module = { version = "0.137.2", optional = true }
cranelift-native = { version = "0.137.2", optional = true }

serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
hmac-sha256 = { version = "1.1.15", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"], optional = true }

[features]
# Native code generation for compiled Verilog-A modules through Cranelift.
jit = ["dep:serde", "dep:serde_json", "dep:hmac-sha256", "dep:rustix", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
