[package]
name = "sansho-mcp"
description = "Model Context Protocol server exposing Sansho to AI agents (stdio)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "sansho-mcp"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sansho-api = { path = "../sansho-api" }
sansho-diag = { path = "../sansho-diag" }
