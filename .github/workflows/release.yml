# Provenance: original GitHub release packaging for Sansho.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify the archives without attesting or creating a draft
        type: boolean
        default: true
        required: true

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" or os.environ["DRY_RUN"] != "true":
              if os.environ["GITHUB_REF"] != f"refs/tags/v{version}":
                  raise SystemExit(f"A draft requires the existing v{version} tag")
          changelog = Path("CHANGELOG.md").read_text()
          section = re.search(
              rf"^## \[{re.escape(version)}\] - [^\n]+\n(.+?)(?=^## |^\[[^\n]+\]:|\Z)",
              changelog, re.M | re.S,
          )
          if not section or not section[1].strip():
              raise SystemExit(f"Missing release notes for {version}")
          Path("notes.md").write_text(section[1].strip() + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + version, file=output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog-notes
          path: notes.md

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install target for the repository toolchain
        run: rustup target add "$TARGET"
      - name: Check release notices
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fetch --locked
          python3 tools/third_party_licenses.py --check
      - name: Build binaries and test the shipped feature set
        run: |
          build=(cargo build --release --locked --target "$TARGET" -p sansho-cli -p sansho-mcp --bins)
          # jit is the only optional release feature in v0.1. The experimental gpu
          # feature is left to source builds.
          features=(--features sansho-cli/jit,sansho-mcp/jit)
          backend="interpreter and JIT"
          if ! "${build[@]}" "${features[@]}"; then
            echo "::warning::JIT build failed on $TARGET. Testing the interpreter-only build."
            features=(--no-default-features)
            backend="interpreter only (JIT build failed)"
            "${build[@]}" "${features[@]}"
          fi
          cargo test --workspace --locked --target "$TARGET" "${features[@]}"
          echo "$TARGET — $backend" > "backend-$TARGET.txt"
          cat "backend-$TARGET.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Package the archive
        run: |
          stem="sansho-$VERSION-$TARGET"
          mkdir -p "$stem" dist
          ext=""
          if [[ "$RUNNER_OS" == Windows ]]; then ext=".exe"; fi
          cp "target/$TARGET/release/sansho$ext" "target/$TARGET/release/sansho-mcp$ext" "$stem/"
          cp README.md LICENSE-APACHE LICENSE-MIT NOTICE THIRD-PARTY-LICENSES.md CHANGELOG.md "$stem/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m zipfile -c "dist/$stem.zip" "$stem"
          else
            tar -czf "dist/$stem.tar.gz" "$stem"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.target }}
          path: backend-*.txt

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-*
          merge-multiple: true
          path: backends
      - name: Verify checksums and finish release notes
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sha256sum "sansho-$VERSION-"{x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-apple-darwin}.tar.gz \
            "sansho-$VERSION-x86_64-pc-windows-msvc.zip" > SHA256SUMS
          sha256sum --check SHA256SUMS
          if grep -q 'interpreter only' ../backends/backend-*.txt; then
            printf '\n### Verilog-A backends by platform\n\n' >> ../notes.md
            sed 's/^/- /' ../backends/backend-*.txt >> ../notes.md
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            dist/
            notes.md

  draft:
    if: github.event_name == 'push' || !inputs['dry-run']
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Sansho v$VERSION" --notes-file notes.md dist/*
